<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Décompte</title>
<style>
  :root {
    --bg: #f4edde;
    --fg: #f5f7ff;
    --accent: red;
    --muted: black;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: clamp(1.1rem, 5vw, 2.5rem);
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 2.5rem;
    letter-spacing: 0.02em;
  }
  .countdown {
    display: flex;
    gap: clamp(6px, 2vw, 32px);
    flex-wrap: nowrap;
    justify-content: center;
    width: 100%;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 0;
    min-width: 0;
  }
  .value {
    font-size: clamp(1.6rem, 9vw, 8rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    line-height: 1;
  }
  .label {
    margin-top: 8px;
    font-size: clamp(0.55rem, 2.5vw, 0.9rem);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .done {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 700;
    color: var(--accent);
  }

  .blc {
    display: none;
  }
</style>
</head>
<body>

  <h1 id="title">Hyxa libéré dans : </h1>
  <div class="countdown" id="countdown"></div>

  <script>
    // ==== À personnaliser ====
    const TARGET_DATE = "2026-08-28T16:26:00+02:00"; // date/heure cible en heure française (le +02:00 = même instant pour tout le monde, où qu'il soit)
    const TITLE = "Hyxa libéré dans : ";                   // titre affiché au-dessus
    // =========================

    document.getElementById("title").textContent = TITLE;
    document.title = TITLE;

    const target = new Date(TARGET_DATE).getTime();
    const el = document.getElementById("countdown");

    function render() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        el.innerHTML = '<div class="done"> HYXA EST LIBRE</div>';
        document.getElementById("title").classList.add('blc')
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      const units = [
        [days, "Jours"],
        [hours, "Heures"],
        [minutes, "Minutes"],
        [seconds, "Secondes"],
      ];

      el.innerHTML = units.map(([value, label]) => `
        <div class="unit">
          <div class="value">${String(value).padStart(2, "0")}</div>
          <div class="label">${label}</div>
        </div>
      `).join("");
    }

    render();
    const timer = setInterval(render, 1000);
  </script>

</body>
</html>
